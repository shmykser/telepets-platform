# Render Blueprint для Telepets Platform
# Документация: https://render.com/docs/blueprint-spec

services:
  # Backend API (FastAPI)
  - type: web
    name: telepets-api
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /monitoring/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: $PORT
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: true
      - key: SKIP_DB_ON_STARTUP
        value: false
      - key: API_BASE_URL
        sync: false  # Установить вручную после деплоя
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false  # Установить вручную
      - key: HF_API_TOKEN
        sync: false  # Установить вручную (опционально)
      - key: DATABASE_URL
        fromDatabase:
          name: telepets-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false  # Установить после деплоя фронтенда
    
  # Telegram Bot (Background Worker)
  - type: worker
    name: telepets-bot
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_PUBLIC_URL
        value: https://telepets-api.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: telepets-db
          property: connectionString

databases:
  # PostgreSQL Database
  - name: telepets-db
    databaseName: telepets
    user: telepets
    region: frankfurt
    plan: free
    postgresMajorVersion: 15

# Примечание: Frontend (WebApp и Games) деплоятся на GitHub Pages
# См. DEPLOYMENT_GUIDE.md для инструкций

