name: Deploy Frontends to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'frontends/**'
      - '.github/workflows/deploy-frontends.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontends/webapp/package-lock.json
            frontends/games/package-lock.json
      
      # Build WebApp
      - name: Install WebApp dependencies
        working-directory: frontends/webapp
        run: npm ci
      
      - name: Build WebApp
        working-directory: frontends/webapp
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://telepets-api.onrender.com' }}
        run: npm run build
      
      # Build Games
      - name: Install Games dependencies
        working-directory: frontends/games
        run: npm ci
      
      - name: Build Games
        working-directory: frontends/games
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://telepets-api.onrender.com' }}
        run: npm run build
      
      # Combine builds into single deployment
      - name: Prepare deployment directory
        run: |
          mkdir -p _site
          # Копируем webapp в корень (включая index.html от React)
          cp -r frontends/webapp/dist/* _site/
          # Копируем games в /games
          mkdir -p _site/games
          cp -r frontends/games/dist/* _site/games/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

