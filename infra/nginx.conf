events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=webapp:10m rate=100r/s;

    # Upstream backend
    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API routes
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Games (Phaser) - Static assets
        location /games/assets/ {
            alias /usr/share/nginx/html/games/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # WebApp (React) - Main route
        location /webapp/ {
            limit_req zone=webapp burst=50 nodelay;
            alias /usr/share/nginx/html/webapp/;
            try_files $uri $uri/ /webapp/index.html;
        }

        # Games (Phaser) - Main route
        location /games/ {
            limit_req zone=webapp burst=50 nodelay;
            alias /usr/share/nginx/html/games/;
            try_files $uri $uri/ /games/index.html;
        }

        # Pet Thief Direct Launch - Test route
        location /petthief {
            limit_req zone=webapp burst=50 nodelay;
            alias /usr/share/nginx/html/games/;
            try_files $uri /petthief.html =404;
        }

        # WebApp (React) - Root route
        location / {
            limit_req zone=webapp burst=50 nodelay;
            root /usr/share/nginx/html/webapp;
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
