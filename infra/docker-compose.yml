version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    env_file:
      - ../.env
    depends_on:
      - postgres
    volumes:
      - ../backend:/app
    networks:
      - telepets-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=telepets
      - POSTGRES_USER=telepets
      - POSTGRES_PASSWORD=telepets
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - telepets-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../frontends/webapp/dist:/usr/share/nginx/html/webapp
      - ../frontends/games/dist:/usr/share/nginx/html/games
    depends_on:
      - backend
    networks:
      - telepets-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - telepets-network

volumes:
  postgres_data:

networks:
  telepets-network:
    driver: bridge
